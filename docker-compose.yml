services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_password
    ports:
      - "5432:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data

volumes:
  attendance_pgdata:
